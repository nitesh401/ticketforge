spring:
  application:
    name: ticketforge
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketforge}
    username: ${DB_USERNAME:ticketforge}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # Flyway owns the schema
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    redis:
      enabled: ${REDIS_ENABLED:false}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

ticketforge:
  hold:
    duration: PT5M
    default-strategy: ATOMIC       # ATOMIC | PESSIMISTIC
    sweeper-enabled: true
    sweep-interval-ms: 1000
  retry:
    max-attempts: 5
    initial-backoff: PT0.02S
    max-backoff: PT0.5S
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-ttl: PT1H
    dev-token-endpoint-enabled: true     # disable in any real deployment
    payment-webhook-secret: ${PAYMENT_WEBHOOK_SECRET}
  redis:
    enabled: ${REDIS_ENABLED:false}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
  demo:
    unsafe-inventory-enabled: false
  waiting-room:
    enabled: false
    admit-per-second: 200
    admission-ttl: PT2M
    max-queue-size: 100000
